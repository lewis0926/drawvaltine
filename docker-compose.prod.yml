services:
  nginx-proxy:
    build:
      context: ./nginx-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - strapi
    networks:
      - web

  frontend:
    image: ghcr.io/lewis0926/drawvaltine/frontend:latest
    restart: unless-stopped
    volumes:
      - ./frontend/config.json:/usr/share/nginx/html/config.json:ro
    networks:
      - web

  strapi:
    image: ghcr.io/lewis0926/drawvaltine/strapi:latest
    restart: unless-stopped
    env_file:
      - ./strapi/.env
    volumes:
      - strapi_data:/app/db
      - strapi_uploads:/app/public/uploads
    networks:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  web:
    driver: bridge

volumes:
  strapi_data:
  strapi_uploads:
  certbot_conf:
  certbot_www:
