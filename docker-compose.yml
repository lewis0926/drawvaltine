services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:80
    volumes:
      - ./frontend/config.json:/usr/share/nginx/html/config.json:ro

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    ports:
      - 1337:1337
    volumes:
      - ./strapi/.env:/app/.env:ro
      - strapi_data:/app/.tmp
      - strapi_uploads:/app/public/uploads

volumes:
  strapi_data:
  strapi_uploads: