services:
  frontend:
    image: ghcr.io/lewis0926/drawvaltine/frontend:latest
    restart: unless-stopped
    volumes:
      - ./frontend/config.json:/usr/share/nginx/html/config.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`drawvaltine.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - web

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-payload}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web

  payload:
    image: ghcr.io/lewis0926/drawvaltine/payload:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-payload}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
    volumes:
      - payload_media:/app/media
    labels:
      - "traefik.enable=true"
      # Route /admin, /api, /_next, /media to payload
      - >
        traefik.http.routers.payload.rule=
        Host(`drawvaltine.com`) &&
        (PathPrefix(`/admin`) ||
         PathPrefix(`/api`) ||
         PathPrefix(`/_next`) ||
         PathPrefix(`/media`))
      - "traefik.http.routers.payload.entrypoints=websecure"
      - "traefik.http.routers.payload.tls.certresolver=le"
      - "traefik.http.services.payload.loadbalancer.server.port=3000"
      # Headers middleware for proper forwarding
      - "traefik.http.middlewares.payload-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.payload.middlewares=payload-headers"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web

volumes:
  postgres_data:
  payload_media:

networks:
  web:
    external: true
    name: drawvaltine_web
